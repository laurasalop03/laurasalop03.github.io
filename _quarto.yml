project:
  type: website
  output-dir: _site

website:
  title: "Laura Salas López"
  description: "Projects and research notes in quantitative finance, machine learning and optimization."
  site-url: "https://laurasalop03.github.io"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About me
      - href: projects.qmd
        text: Projects
      - href: blog/index.qmd
        text: Notes
    right:
      - icon: github
        href: https://github.com/laurasalop03
        aria-label: GitHub
      - icon: linkedin
        href: "https://www.linkedin.com/in/laura-salas-l%C3%B3pez-3ba7442ba"
        aria-label: LinkedIn
  search:
    location: navbar
    type: overlay
  open-graph:
    image: assets/profile.jpg
    locale: en_US
  twitter-card:
    image: assets/profile.jpg
    card-style: summary
  page-footer:
    left: "&copy; 2026 Laura"
    center: "Built with [Quarto](https://quarto.org). Source on [GitHub](https://github.com/laurasalop03/laurasalop03.github.io)."
    right: "[LinkedIn](https://www.linkedin.com/in/laura-salas-l%C3%B3pez-3ba7442ba) | [Email](mailto:laurasalop@hotmail.com)"

format:
  html:
    theme:
       light: cosmo
       dark: cyborg
    include-in-header: analytics.html
    css: styles.css
    toc: true
    code-copy: true
    code-overflow: wrap
    
comments:
  giscus:
    repo: laurasalop03/laurasalop03.github.io
    repo-id: "R_kgDOUwXU5w"
    category: Announcements
    category-id: "DIC_kwDOUwXU584DJPdk"
    mapping: pathname
    reactions-enabled: true
    input-position: top
    loading: lazy

execute:
  freeze: auto
